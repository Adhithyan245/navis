version: "3.9"

services:
  # ── Navis API ────────────────────────────────────────────────────────────────
  navis-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8100:8100"
    env_file:
      - apps/api/.env
    environment:
      ENV: production
      DEBUG: "false"
      MAX_CONCURRENCY: "20"
      GLOBAL_TIMEOUT: "10"
      WEB_CONCURRENCY: "2"
      REDIS_URL: redis://redis:6379/0
      ACCOUNTS_DATABASE_URL: postgresql://navis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/navis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8100/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Postgres (accounts + synced data) ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navis
      POSTGRES_USER: navis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navis -d navis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis (shared cache + rate limits) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./apps/api/deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./apps/api/deploy/prometheus/navis_token:/etc/prometheus/navis_token:ro
    # Not published: reach it through Grafana (or `docker compose port`).
    expose:
      - "9090"
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./apps/api/deploy/grafana:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana_data:
  pg_data:
