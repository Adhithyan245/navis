# Navis on Render — FREE tier, for testing and demos (not for launch).
#
# Limits of Render's free tier:
#   * services sleep after ~15 min idle; the first visit then takes ~1 minute
#   * free Postgres is deleted after 30 days (accounts and saved data go with it)
#   * no cron jobs, so no scheduled push notifications
#   * no private services, so the API is its own (public) web service; the web
#     app reaches it at its onrender.com address
#
# Deploy: Render → New → Blueprint → this repo → Blueprint path: render.free.yaml
# For launch use render.yaml (paid, always on, private API, push cron).

envVarGroups:
  - name: navis-free-shared
    envVars:
      - key: AUTH_INTERNAL_SECRET
        generateValue: true

services:
  - type: web
    name: navis-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /ready
    envVars:
      - fromGroup: navis-free-shared
      - key: PORT
        value: "8100"
      - key: ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: ACCOUNTS_DATABASE_URL
        fromDatabase:
          name: navis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: navis-cache
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false

  - type: web
    name: navis-web
    runtime: node
    rootDir: apps/web
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /privacy
    envVars:
      - fromGroup: navis-free-shared
      - key: NODE_VERSION
        value: "22"
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_API_URL
        value: /navis-api
      # The API's public address, e.g. https://navis-api.onrender.com (Render
      # shows it on the navis-api page). Needed at build time: after setting
      # or changing it, redeploy navis-web.
      - key: NAVIS_API_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_MAPTILER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPPORT_EMAIL
        sync: false

  - type: keyvalue
    name: navis-cache
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: navis-db
    plan: free
    region: oregon
    databaseName: navis
    user: navis
    ipAllowList: []
