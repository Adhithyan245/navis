<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Navis</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8f8fc; --fg: #18181b; --muted: #52525b; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0c14; --fg: #fafafa; --muted: #a1a1aa; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif;
           padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); text-align: center; }
    main { max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 22px; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Navis needs a connection for maps, events and directions. In an emergency, call the local emergency number directly: 112 works on mobile phones in most countries, 911 in North America.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
